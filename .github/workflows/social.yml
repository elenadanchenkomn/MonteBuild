name: Публикация в Facebook и Instagram
# Каждый час публикует посты из content/social_posts.json, у которых наступило время publish_at.
# Ручной запуск: Actions → «Публикация в Facebook и Instagram» → Run workflow → mode: check (проверить доступ) или publish.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check — проверить доступ, publish — опубликовать то, чему пришло время"
        required: true
        default: check
        type: choice
        options: [check, publish]
permissions:
  contents: write
concurrency:
  group: social-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Опубликовать
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python3 tools/publish_social.py ${{ github.event.inputs.mode || 'publish' }}
      - name: Сохранить статусы постов
        if: always()
        run: |
          if ! git diff --quiet -- content/social_posts.json; then
            git config user.name "montebuild-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/social_posts.json
            git commit -m "Статусы публикаций в соцсетях"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
